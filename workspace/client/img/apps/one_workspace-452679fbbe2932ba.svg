<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none" role="img" aria-labelledby="one-workspace-title">
  <title id="one-workspace-title">One Workspace</title>
  <defs>
    <linearGradient id="ow-bg" x1="38" y1="28" x2="214" y2="233" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5877FF"/>
      <stop offset="0.48" stop-color="#2A39C7"/>
      <stop offset="1" stop-color="#17155F"/>
    </linearGradient>
    <linearGradient id="ow-blue" x1="58" y1="58" x2="125" y2="125" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9AB7FF"/>
      <stop offset="0.45" stop-color="#4E6FFF"/>
      <stop offset="1" stop-color="#3550E8"/>
    </linearGradient>
    <linearGradient id="ow-grey" x1="58" y1="134" x2="122" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2F4F9"/>
      <stop offset="0.52" stop-color="#D7DDE8"/>
      <stop offset="1" stop-color="#B7C0D2"/>
    </linearGradient>
    <linearGradient id="ow-green" x1="140" y1="134" x2="201" y2="198" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9DEFD9"/>
      <stop offset="0.55" stop-color="#59D7C1"/>
      <stop offset="1" stop-color="#2CC1AF"/>
    </linearGradient>
    <filter id="ow-shadow" x="0" y="0" width="256" height="256" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#141A5A" flood-opacity="0.18"/>
    </filter>
    <filter id="ow-tile-shadow" x="0" y="0" width="256" height="256" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2.5" stdDeviation="4" flood-color="#16165E" flood-opacity="0.14"/>
    </filter>
  </defs>

  <g filter="url(#ow-shadow)">
    <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#ow-bg)"/>
  </g>

  <g filter="url(#ow-tile-shadow)">
    <rect x="58" y="58" width="66" height="66" rx="18" fill="url(#ow-blue)"/>
    <rect x="132" y="58" width="66" height="66" rx="18" fill="url(#ow-grey)"/>
    <rect x="58" y="132" width="66" height="66" rx="18" fill="url(#ow-grey)"/>
    <rect x="132" y="132" width="66" height="66" rx="18" fill="url(#ow-green)"/>
  </g>

  <path d="M44 25C53 20 67 18 84 18H196C215 18 231 31 236 50" stroke="#B4C5FF" stroke-opacity="0.35" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M64 59C68 57 73 56 79 56H103" stroke="#D7E3FF" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="round"/>
</svg>
