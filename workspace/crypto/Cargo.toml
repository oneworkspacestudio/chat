[package]
name = "oneworkspace-chat-crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
openmls = { version = "=0.9.0", features = ["js"] }
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
tls_codec = { version = "=0.5.0", features = ["derive", "serde", "mls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.100"
getrandom_old = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_new = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
strip = true
